<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
   <div class="wrapper">
    <h1>LOG IN</h1>
    <form method="POST">

        {{ form.hidden_tag()}}

        <p>
            {{ form.name.label }}
            {{ form.name(placeholder="Username") }}
        </p>

        <p>
            {{ form.email.label }}
            {{ form.email(placeholder="Email")}}
        </p>

        <p>
            {{ form.password.label }}
            {{ form.password(placeholder="Password")}}
        </p>

        <p>
            {{ form.submit()}}
        </p>
        
    </form>
   </div> 
</body>
</html>
